<style>

<script>
const $=s=>document.querySelector(s),K='gestao_grafica_v1';
const ET=['Aprovação de arte','Fila de produção','Em produção','Em acabamento','Finalizado','Pronto para retirada','Em rota de entrega','Entregue/Retirado'];
const ST={aberto:'Aberto',aprovado:'Aprovado',executado:'Executado',pago:'Pago',recusado:'Recusado',arquivado:'Arquivado'};

const MSG0=ET.map(e=>`Olá, {nome}! Seu pedido nº {n} está na etapa: ${e}. Previsão de entrega: {prev}.`);
MSG0[4]='Olá, {nome}! Seu pedido nº {n} foi finalizado. Você vai retirar na loja ou prefere entrega?';
let db,tab='ven',flt='todos',edit=null,its=[],pgq=false,pgv=false,vsd=null,vdm='r',hc=null,ek=null,po=null,pf='and',di={},dl=[],dk=[];
function fresh(){return{emp:{},msg:MSG0,cli:[],it:[],kits:[],par:[],tx:[],orc:[],id:1,seq:1,cfg:{dig:4,mk:0,ent:30,fmt:fmt0(),bw:80,avs:avs0(),rod:'Documento sem valor fiscal'},hist:[],del:[]}}
function fmt0(){return{venda:'b80',orc:'A4',rec:'A5',ped:'A6',arte:'A4'}}
function avs0(){return['A cor impressa pode variar de 5% a 10%, para mais ou para menos, em relação à cor vista na tela.','Confira todos os textos, a ortografia, telefones, endereços, CNPJ, redes sociais, preços e datas. Depois de aprovada, a arte é impressa exatamente como está.','O corte pode variar de 1 a 2 mm. Itens muito próximos da borda podem ser cortados.','Imagens de baixa resolução podem sair pixeladas na impressão.','Cores especiais (neon, metálico e tons sob medida) não são reproduzidas fielmente na impressão digital.','O prazo de entrega começa a contar a partir da aprovação da arte.','Alterações depois da aprovação podem ter custo adicional e novo prazo.','A aprovação pelo WhatsApp vale como assinatura; a data e a hora ficam registradas.']}
const hlog=(o,ev,tx,v)=>db.hist.push({n:o.n,ts:agora(),ev,tx:tx||'',v:v==null?null:v});
function norm(d){d=Object.assign(fresh(),d);d.cfg=Object.assign({dig:4,mk:0,ent:30},d.cfg||{});d.cfg.fmt=Object.assign(fmt0(),d.cfg.fmt||{});if(!d.cfg.bw)d.cfg.bw=80;if(!d.cfg.avs)d.cfg.avs=avs0();if(d.cfg.rod==null)d.cfg.rod='Documento sem valor fiscal';d.par.forEach(p=>{if(!p.tipo)p.tipo='Parceira'});d.orc.forEach(o=>{o.it.forEach((r,i)=>{r.rid=r.rid||'r'+o.id+'_'+i;r.cu=r.cu||0;r.cpu=r.cpu||0});o.pays=o.pays||[];o.hp=o.hp||[];if(!o.venda&&o.ped===undefined)o.ped=o.pays.length&&!o.est&&!['recusado','arquivado'].includes(o.st)?1:0;if(o.dp){o.aj=rnd((+o.aj||0)-sub(o)*o.dp/100);delete o.dp}if(!o.ln){o.ln=[];sync(o);if(o.tl&&o.ln[0])o.ln[0].tl=o.tl;delete o.tl}if(!o.venda&&!o.ped&&o.conf&&!o.est&&!['recusado','arquivado'].includes(o.st))o.ped=1;if(o.tx&&!o.txv){const f=d.tx.find(x=>x.id==o.tx);if(f)o.txv={valor:f.valor,custo:f.custo}}(o.ln||[]).forEach(l=>{if(l.ex&&!l.exv){const f=d.tx.find(x=>x.id==l.ex);if(f)l.exv={valor:f.valor,custo:f.custo}}})});d.hist=d.hist||[];d.del=d.del||[];d.seq=Math.max(+d.seq||1,...d.orc.map(o=>o.n+1),...d.del.map(x=>x.n+1));return d}
function load(){try{return norm(JSON.parse(localStorage.getItem(K))||{})}catch(e){return fresh()}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio.')}if(typeof bkDirty=='function')bkDirty()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fm=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const dt=d=>d?d.split('-').reverse().join('/'):'',hoje=()=>new Date().toLocaleDateString('sv'),agora=()=>new Date().toLocaleString('pt-BR');
const cli=id=>db.cli.find(c=>c.id==id),get=id=>db.orc.find(o=>o.id==id),par=id=>db.par.find(p=>p.id==id),txx=id=>db.tx.find(x=>x.id==id)||{valor:0,custo:0};
const phone=p=>{let d=(p||'').replace(/\D/g,'');return d.length<=11?'55'+d:d};
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const addDU=(d,n)=>{const x=new Date(d+'T12:00');while(n>0){x.setDate(x.getDate()+1);if(x.getDay()%6)n--}return x.toLocaleDateString('sv')};
const rnd=v=>Math.round(v*100)/100,dv=o=>o.dv!=null?o.dv:5,gdv=()=>$('#q-dv').value=='x'?(+$('#q-dv2').value||0):+$('#q-dv').value;const later=f=>setTimeout(f,0);
const sub=o=>o.it.reduce((a,r)=>a+r.t,0),entV=o=>o.gr||o.ed?0:(o.txv?(+o.txv.valor||0):txx(o.tx).valor),extra=o=>(o.ln||[]).reduce((a,l)=>a+(l.ex?(l.exv?l.exv.valor:txx(l.ex).valor):0),0);
const dsc=o=>(o.pays||[]).reduce((a,p)=>a+(p.ds||0),0),base=o=>sub(o)+(+o.aj||0)+entV(o)+extra(o)-dsc(o),rfe=o=>{const rf=+o.rf||0;if(!rf)return 0;const pp=(o.pays||[]).reduce((a,p)=>a+(p.v>0?p.v:0),0);return Math.max(0,rf-Math.max(0,pp-base(o)))},tot=o=>base(o)-rfe(o),hasEnt=o=>!!(o.tx||o.txv||o.gr||o.ed),paid=o=>(o.pays||[]).reduce((a,p)=>a+p.v,0);
const cost=o=>o.it.reduce((a,r)=>a+(r.cu||0),0)+(o.ed?0:(o.txv?(+o.txv.custo||0):(o.tx?(+txx(o.tx).custo||0):0)))+(o.ln||[]).reduce((a,l)=>a+(l.ex?((l.exv?l.exv.custo:txx(l.ex).custo)||0):0),0),lucro=o=>tot(o)-cost(o);
const prevD=o=>o.conf?dt(addDU(o.conf,o.prev||0)):(o.prev||0)+' dias úteis';
const ent=()=>{const n=db.cfg&&db.cfg.ent;return n==null||n===''?30:Math.max(0,Math.min(100,+n||0))},pl=o=>(o.ln||[]).filter(l=>!l.np),unl=o=>tot(o)>0&&(ent()<=0||(paid(o)>0&&paid(o)>=tot(o)*ent()/100-.005)),done=o=>{const p=pl(o);return o.ln.length>0&&(p.length?p.every(l=>l.tl.length>=7):o.ln.every(l=>l.ent))};
const labs=l=>[...ET.slice(0,5),l.modo=='entrega'?'Em rota de entrega':'Pronto para retirada','Entregue/Retirado'];

/* CALCULADORA */
const cal={e:'',h:'',done:false};
const calP=x=>x.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\./g,',');
function calcEv(s){const t=s.match(/\d*\.?\d+|[-+*/%]/g)||[];let i=0;
  const num=()=>{let n=1;while(t[i]=='-'){n=-n;i++}if(t[i]=='+')i++;const x=t[i++];if(x==null||/^[-+*/%]$/.test(x))throw 0;let v=parseFloat(x),pc=false;if(t[i]=='%'){i++;v/=100;pc=true}return{v:n*v,pc}};
  const term=()=>{let a=num();while(t[i]=='*'||t[i]=='/'){const o=t[i++],b=num();if(o=='/'&&b.v==0)throw 0;a={v:o=='*'?a.v*b.v:a.v/b.v,pc:false}}return a};
  let a=term();while(t[i]=='+'||t[i]=='-'){const o=t[i++],b=term(),bv=b.pc?a.v*b.v:b.v;a={v:o=='+'?a.v+bv:a.v-bv,pc:false}}
  if(i<t.length)throw 0;return+a.v.toPrecision(12)}
function calcR(){$('#c-d').textContent=cal.e?calP(cal.e):'0';let h=cal.h;if(!h&&cal.e){try{const r=calcEv(cal.e);if(/[-+*/%]/.test(cal.e.replace(/^-/,'')))h='= '+String(r).replace('.',',')}catch(e){}}$('#c-h').textContent=h}
function calcK(k){const l=cal.e.slice(-1),op=/^[-+*/]$/.test(k);
  if(cal.done){if(/^[\d.]$/.test(k)){cal.e=''}cal.done=false}
  cal.h='';
  if(k=='C'){cal.e=''}
  else if(k=='B'){cal.e=cal.e.slice(0,-1)}
  else if(k=='='){if(!cal.e)return;try{const r=calcEv(cal.e);cal.h=calP(cal.e)+' =';cal.e=String(r);cal.done=true}catch(e){cal.h='Expressão inválida'}}
  else if(k=='%'){if(/\d/.test(l))cal.e+='%'}
  else if(op){if(!cal.e){if(k=='-')cal.e='-'}else if(/^[-+*/]$/.test(l)){if(cal.e.length>1)cal.e=cal.e.slice(0,-1)+k}else cal.e+=k}
  else if(k=='.'){const n=cal.e.split(/[-+*/%]/).pop();if(n.includes('.'))return;cal.e+=(n===''?'0':'')+'.'}
  else{if(l=='%')cal.e+='*';cal.e+=k}
  calcR()}
function calcT(){const c=$('#calcp');c.hidden=!c.hidden;if(!c.hidden)calcR()}
function calcCp(){const t=$('#c-d').textContent.replace('−','-');try{navigator.clipboard.writeText(t)}catch(e){}}
document.addEventListener('keydown',e=>{const c=$('#calcp');if(!c||c.hidden)return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&!c.contains(t))return;
  const k=e.key,m={',':'.','x':'*','X':'*','Enter':'=','Backspace':'B','Delete':'C','c':'C','C':'C'};let v=m[k]||k;
  if(k=='Escape'){calcT();e.preventDefault();return}
  if(/^[\d.+\-*/%=]$/.test(v)||v=='B'||v=='C'){e.preventDefault();calcK(v)}});
(function(){const L=[['C','C'],['⌫','B'],['%','%'],['÷','/'],['7'],['8'],['9'],['×','*'],['4'],['5'],['6'],['−','-'],['1'],['2'],['3'],['+','+'],['0'],[',','.'],['=','=','eq']];
  $('#c-k').innerHTML=L.map(([t,k,c])=>`<button type="button" class="${c||(/^[÷×−+]$/.test(t)?'op':'')}" onclick="calcK('${k||t}')">${t}</button>`).join('')})();

function negH(r){const it=db.it.find(x=>x.id==r.iid);if(!it||!tracked(it)||(it.tipo||'un')!='un')return '';const need=its.filter(x=>x.iid==it.id).reduce((a,x)=>a+(+x.q||0),0);return it.est-need<0?' <span class="tag" style="color:#a3281f">estoque negativo</span>':''}
function vpWarn(t,id,q){const chk=(it,n)=>{if(!tracked(it)||(it.tipo||'un')!='un')return;const need=its.filter(x=>x.iid==it.id).reduce((a,x)=>a+(+x.q||0),0)+n;if(it.est-need<0)alert('Sem estoque suficiente de "'+it.nome+'": há '+fm(it.est)+' em estoque. A venda continua permitida, mas o estoque ficará negativo.')};
  if(t=='i'){const it=db.it.find(x=>x.id==id);if(it)chk(it,q)}else{const k=db.kits.find(x=>x.id==id);if(k)k.itens.forEach(c=>{const it=db.it.find(y=>y.id==c.iid);if(it)chk(it,c.q*q)})}}
function stQty(o){const m={},add=(iid,q)=>{if(iid&&q>0)m[iid]=(m[iid]||0)+q};
  o.it.forEach(r=>{const it=db.it.find(x=>x.id==r.iid),k=db.kits.find(x=>x.id==r.kid);
    if(k)k.itens.forEach(c=>add(c.iid,c.q*(+r.q||0)));

  return Object.entries(m).map(([k,q])=>({iid:+k,q}))}
function stockApply(o){if(o.sk)return;o.sk=stQty(o).filter(x=>tracked(db.it.find(y=>y.id==x.iid)));let neg=false;o.sk.forEach(x=>{const it=db.it.find(y=>y.id==x.iid);it.est=+((+it.est)-x.q).toFixed(4);if(it.est<0)neg=true});if(neg)o.neg=1}

  <div class="kpis">${kp('Faturamento Bruto',fmt(d.fat),d.F.length+' venda(s) / pedido(s) fechado(s)')}${kp('Lucro Líquido',fmt(d.luc),d.fat?'margem de '+Math.round(d.luc/d.fat*100)+'% (custo cadastrado)':'sem vendas no período')}${kp('Caixa Real (Recebido)',fmt(d.cx),'entrou no período, já com estornos')}${kp('A Receber',fmt(d.ar),'saldo atual de pedidos em aberto')}</div>`;
  if(vazio)return h+'<div class="form" style="text-align:center;color:var(--mut)">Nenhum registro no período</div>';
  const ef=sc=='pdv'?'<div class="mut">Orçamentos não se aplicam às vendas diretas.</div>':`<div>Taxa de aprovação de orçamentos<div style="font-size:18px"><b>${d.Y?d.X+' de '+d.Y+' aprovados ('+Math.round(d.X/d.Y*100)+'%)':'—'}</b></div>${d.Y?'':'<div class="mut">Nenhum orçamento criado no período</div>'}</div>`;
  h+=`<div class="g2"><div class="form"><b>Eficiência comercial</b><div style="margin-top:6px">${ef}<div style="margin-top:10px">Ticket médio por venda/pedido fechado<div style="font-size:18px"><b>${d.F.length?fmt(d.tick):'—'}</b></div></div></div></div>
  <div class="form"><b>Formas de pagamento</b><div style="margin-top:6px">${Object.keys(d.mf).length?bars(d.mf):'<div class="mut">Nenhum recebimento no período</div>'}</div></div></div>`;
  const tpH=d.tp.length?`<div class="form"><b>Top produtos</b><div style="overflow-x:auto"><table class="tb"><tr><th>Produto</th><th class="n">Qtd. Vendida</th><th class="n">Lucro Gerado</th></tr>${d.tp.map(([k,e])=>`<tr><td>${esc(k)}</td><td class="n">${fm(e.q)}</td><td class="n">${fmt(e.l)}</td></tr>`).join('')}</table></div><div class="mut">Lucro por produto antes de descontos e entrega.</div></div>`:'',
    tcH=d.tc.length?`<div class="form"><b>Ranking de clientes</b><div style="overflow-x:auto"><table class="tb"><tr><th>Cliente</th><th class="n">Compras</th><th class="n">Faturamento</th></tr>${d.tc.map(([n,e])=>`<tr><td>${esc(n)}</td><td class="n">${e.n}</td><td class="n">${fmt(e.t)}</td></tr>`).join('')}</table></div></div>`:'';
  return h+(tpH||tcH?`<div class="g2" ${tpH&&tcH?'':'style="grid-template-columns:1fr"'}>${tpH}${tcH}</div>`:'<div class="form" style="text-align:center;color:var(--mut)">Nenhum produto vendido nem cliente com faturamento no período</div>')}

/* HISTÓRICO GERAL */
let hqs='',hsn=null;
function histRows(){return[...db.orc.map(o=>({n:o.n,tipo:o.venda?'Venda':o.ped?'Pedido':'Orçamento',cli:(cli(o.cid)||{}).nome||'',total:tot(o),st:o.est?'Estornado':ST[o.st],data:o.data})),...db.del.map(x=>({n:x.n,tipo:x.tipo,cli:x.cli,total:x.total,st:'Excluído',data:x.data,x}))].sort((a,b)=>b.n-a.n)}
function histL(){const q=hqs.trim(),qn=/^\d+$/.test(q),l=histRows().filter(r=>!q||(qn?String(r.n).startsWith(q):nz(r.cli+' '+r.tipo+' '+r.st).includes(nz(q))));
  return l.slice(0,60).map(r=>`<div class="item"><div class="row" style="cursor:pointer" onclick="hsn=hsn==${r.n}?null:${r.n};$('#hl').innerHTML=histL()"><span><b>Nº ${r.n}</b> · ${r.tipo} · ${esc(r.cli||'sem cliente')}</span><span><span class="tag">${r.st}</span> ${fmt(r.total)}</span></div>
  ${hsn==r.n?`<div class="mut">${db.hist.filter(h=>h.n==r.n).map(h=>`<div>${esc(h.ts)} · ${esc(h.ev)}${h.tx?' — '+esc(h.tx):''}${h.v!=null?' · '+fmt(h.v):''}</div>`).join('')||'<div>Sem eventos registrados.</div>'}${r.x?`<div style="margin-top:6px"><b>Registro excluído em ${esc(r.x.em)}</b>${r.x.mt?' — motivo: '+esc(r.x.mt):''}<br>${r.x.it.map(i=>esc(i.d)+' ('+fm(i.q)+') '+fmt(i.t)).join('; ')}<br>Pagamentos: ${r.x.pays.map(p=>fmt(p.v)+' '+esc(p.f)).join(', ')||'nenhum'}</div>`:''}</div>`:''}</div>`).join('')||'<div class="item mut">Nenhum registro encontrado.</div>'}

/* CONFIGURAÇÕES */
const CS=[['loja','Dados da loja'],['taxas','Taxas de entrega'],['msgs','Mensagens de status'],['prod','Produtos (código e markup)'],['prc','Produção (entrada mínima)'],['imp','Impressão e PDF'],['hist','Histórico geral'],['dados','Dados e backup']];
function vCfg(){const e=db.emp,F=[['nome','Nome da loja'],['end','Endereço'],['tel','Telefone / WhatsApp'],['ig','Instagram'],['cnpj','CNPJ (opcional)'],['pix','Chave Pix'],['titular','Titular do Pix']];
  const S={
  loja:()=>`<div class="form"><b>Dados da loja (aparecem no PDF)</b><div class="g2">${F.map(([k,l])=>`<label>${l}<input value="${esc(e[k])}" onchange="db.emp.${k}=this.value;save()"></label>`).join('')}</div>
  <label>Logo<input type="file" accept="image/*" onchange="logo(this.files[0])"></label>${e.logo?`<img src="${e.logo}" style="max-height:60px"> <button onclick="delete db.emp.logo;save();render()">Remover logo</button>`:''}</div>`,
  taxas:()=>`<div class="form"><b>Taxas de entrega</b><div class="g2"><label>Nome da taxa (ex.: Área 1)<input id="xn"></label><label>Valor cobrado do cliente (R$)<input id="xv" type="number" step="any"></label><label>Custo da entrega, o que você paga (R$)<input id="xc" type="number" step="any"></label></div><button class="pri" onclick="addX()">Adicionar taxa</button>
  ${db.tx.map(x=>`<div class="row">${esc(x.nome)} · ${fmt(x.valor)} <span class="mut">custo ${fmt(x.custo)}</span><span class="acts"><button onclick="txPop(${x.id})">Editar</button><button class="del" onclick="db.tx=db.tx.filter(y=>y.id!=${x.id});save();render()">Excluir</button></span></div>`).join('')}<div class="mut">Ao editar uma taxa, a mudança vale só para novos pedidos e vendas. Os registros antigos mantêm o valor da época.</div></div>`,
  msgs:()=>`<div class="form"><b>Mensagens de status (use {nome}, {n}, {prev})</b>${ET.map((t,i)=>`<label>${t}<textarea rows="2" onchange="db.msg[${i}]=this.value;save()">${esc(db.msg[i])}</textarea></label>`).join('')}</div>`,
  prod:()=>`<div class="form"><b>Produtos: código e markup</b><label>Quantidade de dígitos do código automático (completa com zeros à esquerda; ex.: 4 gera 0001, 0002, 0003)<input type="number" min="0" max="12" value="${db.cfg.dig}" onchange="db.cfg.dig=Math.max(0,Math.min(12,parseInt(this.value)||0));save();render()"></label><div class="mut">Próximo código automático: <b>${esc(nextCod())}</b></div><label>Markup padrão (%) para calcular o preço de venda sobre o custo<input type="number" min="0" step="any" value="${db.cfg.mk}" onchange="mkSet(this.value)"></label><div class="mut">Usado nos produtos em que a caixa "Calcular pelo markup" está marcada. Ao mudar o percentual, esses produtos são recalculados.</div></div>`,
  prc:()=>`<div class="form"><b>Produção: entrada mínima</b><label>Entrada mínima para liberar a produção (% do valor do pedido)<input type="number" min="0" max="100" step="any" value="${ent()}" onchange="db.cfg.ent=Math.max(0,Math.min(100,+this.value||0));save();render()"></label><div class="mut">Qualquer valor de entrada pode ser registrado. A produção só é liberada quando o total pago alcança esse percentual; até lá o pedido fica "Aguardando liberação". O mesmo percentual aparece nas condições do PDF e do WhatsApp. Com 0%, a produção é liberada sem pagamento.</div></div>`,
  imp:()=>`<div class="form"><b>Formato de cada documento</b>${[['venda','Venda (cupom)'],['orc','Orçamento'],['rec','Recibo de pagamento'],['ped','Pedido (comprovante)'],['arte','Aprovação de arte']].map(([k,t])=>`<label>${t}<select onchange="db.cfg.fmt.${k}=this.value;save()">${PGL.map(([v,l])=>`<option value="${v}" ${db.cfg.fmt[k]==v?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}<label>Largura da bobina personalizada (mm)<input type="number" min="40" max="120" value="${db.cfg.bw}" onchange="db.cfg.bw=Math.max(40,Math.min(120,+this.value||80));save()"></label><div class="mut">As bobinas mais comuns de impressora térmica são de 58 mm e de 80 mm, com altura automática. Teste na sua impressora e, se precisar, use a largura personalizada. Na tela de impressão do navegador, escolha a impressora e o papel correspondentes.</div></div>
  <div class="form"><b>Avisos da aprovação de arte</b><div class="mut">Um aviso por linha. Eles aparecem no PDF de aprovação de arte.</div><textarea rows="10" onchange="db.cfg.avs=this.value.split('\n').map(x=>x.trim()).filter(Boolean);save()">${esc((db.cfg.avs||[]).join('\n'))}</textarea><button onclick="db.cfg.avs=avs0();save();render()">Restaurar sugestão</button></div>
  <div class="form"><b>Cupom da venda</b><label>Texto no rodapé<input value="${esc(db.cfg.rod||'')}" onchange="db.cfg.rod=this.value;save()"></label></div>`,
  hist:()=>`<div class="form"><b>Histórico geral por número</b><div class="mut">Guarda todo número de venda, orçamento e pedido, mesmo apagado. Números não são reutilizados. Próximo número: <b>${db.seq}</b></div><input type="search" id="hq-i" placeholder="Buscar por número, cliente ou tipo" value="${esc(hqs)}" oninput="hqs=this.value;$('#hl').innerHTML=histL()"><div id="hl">${histL()}</div></div>`,
  dados:()=>`<div class="form"><b>Backup</b><p class="mut">Versão do programa: <b>${APP_V}</b>. Os dados ficam neste navegador (os PDFs das artes também). Baixe um backup com frequência.</p><div class="acts"><button class="pri" onclick="exp()">Baixar backup</button><button onclick="$('#imp-f').click()">Restaurar backup</button><input id="imp-f" type="file" accept=".json" hidden onchange="imp(this.files[0])"><button class="del" onclick="zerar()">Zerar tudo</button></div><p class="mut">"Zerar tudo" apaga clientes, produtos, vendas, orçamentos, pedidos, artes e configurações, e reinicia a numeração em 1 (um backup é baixado antes). Se estiver conectado, o backup da conta Google também é apagado.</p><div id="bk-box">${bkH()}</div></div>`};
  if(!S[cs])cs='loja';
  return `<div class="cfg ${cso?'open':''}"><div class="cfgl">${CS.map(([k,t])=>`<button class="${cs==k?'on':''}" onclick="cs='${k}';cso=true;render()">${t}</button>`).join('')}</div><div class="cfgc"><button class="cfgb" onclick="cso=false;render()">← Seções</button>${S[cs]()}</div></div>`}
function txPop(id){const x=db.tx.find(y=>y.id==id);if(!x)return;
  $('#dtx').innerHTML=`<div class="pagehd"><h3>Editar taxa de entrega</h3><button type="button" onclick="$('#dtx').close()" aria-label="Fechar" title="Fechar">✕</button></div><label>Nome da taxa<input id="tx-n" value="${esc(x.nome)}"></label><div class="g2"><label>Valor cobrado do cliente (R$)<input id="tx-v" type="number" step="any" value="${x.valor}"></label><label>Custo da entrega (R$)<input id="tx-c" type="number" step="any" value="${x.custo||0}"></label></div><div class="mut">A alteração vale só para novos pedidos e vendas. Os registros antigos mantêm o valor da época.</div><div class="acts" style="justify-content:flex-end;margin-top:8px"><button type="button" onclick="$('#dtx').close()">Voltar</button><button type="button" class="pri" onclick="txSave(${id})">Salvar</button></div>`;$('#dtx').showModal()}
function txSave(id){const x=db.tx.find(y=>y.id==id),n=$('#tx-n').value.trim();if(!x)return;if(!n)return $('#tx-n').focus();x.nome=n;x.valor=+$('#tx-v').value||0;x.custo=+$('#tx-c').value||0;save();$('#dtx').close();render()}
function addX(){if(!$('#xn').value.trim())return;db.tx.push({id:db.id++,nome:$('#xn').value,valor:+$('#xv').value||0,custo:+$('#xc').value||0});save();render()}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.emp.logo=c.toDataURL('image/png');save();render()};i.src=r.result};r.readAsDataURL(f)}
async function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,_files:await fall()})],{type:'application/json'}));a.download='gestao-grafica-backup-'+hoje()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.orc||!d.cli)throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;const fl=d._files||{};delete d._files;db=norm(d);save();await fclr();for(const k in fl)await fput(k,fl[k]);render()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
async function zerar(){if(!confirm('Isso apaga TODOS os dados deste aparelho'+(BK.email?' e o backup da conta Google ('+BK.email+')':'')+' (clientes, produtos, vendas, orçamentos, pedidos, artes e configurações), reinicia a numeração em 1 e apaga o histórico de números. Um backup em arquivo será baixado antes. Deseja mesmo apagar?'))return;if(prompt('Digite APAGAR para continuar:')!=='APAGAR')return;await exp();if(BK.email){try{const t=await gTok(true);for(const f of await drList(t))await dr(DA+'/'+f.id,{method:'DELETE'},t)}catch(e){if(!confirm('Não foi possível apagar o backup da conta ('+e.message+'). Apagar só os dados deste aparelho?'))return}}localStorage.removeItem(K);await fclr();db=fresh();save();BK.hd=(await bkSnap()).h;BK.pend=0;BK.conf=0;bkSave();tab='ven';po=null;render()}
{let g=null;try{g=localStorage.getItem('gg_nav')}catch(e){}$('#tabs').classList.toggle('sm',g==null?innerWidth<=720:g=='1')}
render();
</script>
<script>
// Registro PWA: não altera os dados nem a lógica do Gestão da Gráfica.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch(err => console.error('Falha ao registrar o modo offline:', err));
  });
}
</script>
</body></html>
