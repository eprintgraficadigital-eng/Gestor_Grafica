<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão da Gráfica</title>
<style>
:root{--bg:#eef1f4;--pan:#fff;--ink:#16212b;--mut:#66727e;--line:#d5dbe1;--acc:#1b4f8a;--acc2:#e8eef6}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:2px 0 6px}
input[type=checkbox]{width:auto}
button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:var(--acc2)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.del{color:#a3281f}
:focus-visible{outline:2px solid var(--acc)}
header{padding:9px 16px;background:var(--ink);color:#fff}
#tabs{display:flex;gap:2px;padding:0 10px;background:var(--pan);border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 12px;white-space:nowrap}
#tabs button.on{border-color:var(--acc);font-weight:600}
#main{max-width:1000px;margin:0 auto;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:12px}.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.acts input,.acts select{width:auto;margin:0}
.chip{border-radius:20px;padding:3px 11px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.list,.form{background:var(--pan);border:1px solid var(--line);border-radius:8px;margin-top:10px}.form{padding:12px}
.item{padding:10px 12px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.click{cursor:pointer}.click:hover{background:var(--acc2)}
.s-aberto{border-left:4px solid #c98a00}.s-aprovado{border-left:4px solid #1b6fd1}.s-executado{border-left:4px solid #7b4bb3}.s-pago{border-left:4px solid #1f8a4c}.s-recusado,.s-arquivado{border-left:4px solid #8a949d}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--acc2);font-size:12px;font-weight:600}
dialog{width:min(840px,96vw);border:0;border-radius:10px;padding:16px}dialog::backdrop{background:#0008}
.it{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.2fr 1.2fr 1fr;gap:6px;align-items:end}.it .rm{grid-column:1/-1;justify-self:end}.rw{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fafbfc}label{display:block;font-size:12px;color:var(--mut)}label input[type=checkbox]{margin-right:6px}
.ex{background:var(--acc2);padding:8px;border-radius:6px;margin-top:6px}.ex label{display:inline-block;margin-right:12px}.ex input,.ex select{width:130px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.br{display:grid;grid-template-columns:130px 1fr 100px;gap:8px;align-items:center;margin:3px 0}.br i{display:block;height:12px;background:var(--acc);border-radius:3px}.br b{text-align:right;font-weight:600}
.stp{margin:3px 0 0 6px;padding-left:10px;border-left:3px solid #1f8a4c;font-size:13px}.cur{margin:8px 0 0 6px;padding:8px;border:2px solid var(--acc);border-radius:8px}.lock{margin-top:8px;padding:8px;background:#fdecea;border-radius:6px;color:#a3281f}
.warn{background:#fff4d6;padding:4px 8px;border-radius:6px;margin-top:4px}.pl{border-left:4px solid #c98a00}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:9}
#print{display:none}
@media print{html,body{background:#fff!important}body>*:not(#print){display:none!important}#print{display:block;font:13px Arial;color:#000;background:#fff}
.ph{display:flex;gap:14px;align-items:center;border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:8px}.ph img{max-height:80px;max-width:150px}.ph h1{margin:0;font-size:19px}.ph .ob{border:1px solid #000;padding:6px 10px;text-align:right;white-space:nowrap}
#print table{width:100%;border-collapse:collapse;margin:10px 0}#print th,#print td{border-bottom:1px solid #999;padding:5px;text-align:left}
#print .big{font-size:17px;font-weight:bold;text-align:right}#print .bx{border:1px solid #999;padding:8px;margin:8px 0}}
@media(max-width:720px){body{font-size:15px}#main{padding:8px}button,input,select,textarea{font-size:16px;min-height:40px}.g2{grid-template-columns:1fr}.it{grid-template-columns:1fr 1fr}.it .c1{grid-column:1/-1}.br{grid-template-columns:90px 1fr 84px}dialog{width:100vw;max-width:100vw;min-height:100vh;border-radius:0;padding:10px}.acts button{flex:1 1 auto}.ex input,.ex select{width:100%}}</style><style id="pg"></style></head><body>
<header><b>Gestão da Gráfica</b></header><nav id="tabs"></nav><main id="main"></main>

<dialog id="dq"><h3 id="dqt" style="margin:0 0 8px"></h3>
<div class="g2"><div><label>Cliente<select id="q-c"></select></label><button type="button" onclick="$('#q-nc').hidden=!$('#q-nc').hidden">+ Novo cliente</button></div><label>Data do orçamento<input type="date" id="q-d"></label></div>
<div id="q-nc" class="ex" hidden><div class="row"><b>Novo cliente</b><button type="button" onclick="fcq()">✕ Fechar</button></div><div class="g2"><label>Nome<input id="nc-n" oninput="dupCq()"></label><label>Telefone / WhatsApp<input id="nc-t" oninput="dupCq()" placeholder="(85) 99999-9999"></label></div><label>Endereço<input id="nc-e"></label><div id="nc-dup" class="acts mut"></div><div class="acts"><button type="button" class="pri" onclick="addCq()">Salvar cliente e selecionar</button><button type="button" onclick="fcq()">Cancelar</button></div></div>
<div id="q-i" style="margin-top:8px"></div>
<button onclick="addRow()">+ Item</button>
<div class="g2" style="margin-top:8px"><label class="nv">Entrega<select id="q-x" onchange="qt()"></select></label><label class="nv"><br><input type="checkbox" id="q-g" onchange="qt()"> Entrega grátis (promoção)</label>
<label>Desconto no pagamento à vista<select id="q-dv" onchange="dvSel()"><option value="5">5% (padrão)</option><option value="10">10%</option><option value="x">Outro valor (%)</option></select><input type="number" step="any" id="q-dv2" placeholder="% de desconto" hidden></label><label>Ajuste em R$ (use − para desconto em valor)<input type="number" step="any" id="q-a" oninput="qt()"></label>
<label class="nv">Validade do orçamento (dias)<input type="number" id="q-v"></label><label class="nv">Previsão de produção (dias úteis)<input type="number" id="q-pv"></label></div>
<label>Observações<textarea id="q-o" rows="2"></textarea></label>
<div id="q-pg"></div>
<div class="row"><span><b>Total: <span id="q-t"></span></b><br><span class="mut" id="q-l"></span></span><span class="acts"><button onclick="$('#dq').close()">Fechar</button><button class="pri" onclick="saveQ()">Salvar</button></span></div></dialog>
<datalist id="dsrv"></datalist>
<div id="bar" hidden><span>Salve o PDF e depois anexe na conversa.</span><button class="pri" id="bar-b">Abrir WhatsApp do cliente</button><button onclick="$('#bar').hidden=true">Fechar</button></div>
<div id="print"></div>

<script>
const $=s=>document.querySelector(s),K='gestao_grafica_v1';
const ET=['Confirmação de arte','Fila de produção','Em produção','Em acabamento','Finalizado','Pronto para retirada','Em rota de entrega','Entregue/Retirado'];
const ST={aberto:'Aberto',aprovado:'Aprovado',executado:'Executado',pago:'Pago',recusado:'Recusado',arquivado:'Arquivado'};
const FP=['Pix','Cartão de débito','Cartão de crédito','Dinheiro (na loja)'];
const MSG0=ET.map(e=>`Olá, {nome}! Seu pedido nº {n} está na etapa: ${e}. Previsão de entrega: {prev}.`);
MSG0[4]='Olá, {nome}! Seu pedido nº {n} foi finalizado. Você vai retirar na loja ou prefere entrega?';
let db,tab='ven',flt='todos',edit=null,its=[],hc=null,ec=null,ei=null,ek=null,est='mes',po=null,pf='and',di={},dl=[],dk=[];
function fresh(){return{emp:{},msg:MSG0,cli:[],it:[],kits:[],par:[],tx:[],orc:[],id:1,seq:1}}
function norm(d){d=Object.assign(fresh(),d);d.orc.forEach(o=>{o.it.forEach((r,i)=>{r.rid=r.rid||'r'+o.id+'_'+i;r.cu=r.cu||0;r.cpu=r.cpu||0});o.pays=o.pays||[];o.hp=o.hp||[];if(o.dp){o.aj=rnd((+o.aj||0)-sub(o)*o.dp/100);delete o.dp}if(!o.ln){o.ln=[];sync(o);if(o.tl&&o.ln[0])o.ln[0].tl=o.tl;delete o.tl}});return d}
function load(){try{return norm(JSON.parse(localStorage.getItem(K))||{})}catch(e){return fresh()}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio.')}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fm=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const dt=d=>d?d.split('-').reverse().join('/'):'',hoje=()=>new Date().toLocaleDateString('sv'),agora=()=>new Date().toLocaleString('pt-BR');
const cli=id=>db.cli.find(c=>c.id==id),get=id=>db.orc.find(o=>o.id==id),par=id=>db.par.find(p=>p.id==id),txx=id=>db.tx.find(x=>x.id==id)||{valor:0,custo:0};
const phone=p=>{let d=(p||'').replace(/\D/g,'');return d.length<=11?'55'+d:d};
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const addDU=(d,n)=>{const x=new Date(d+'T12:00');while(n>0){x.setDate(x.getDate()+1);if(x.getDay()%6)n--}return x.toLocaleDateString('sv')};
const rnd=v=>Math.round(v*100)/100,dv=o=>o.dv!=null?o.dv:5,gdv=()=>$('#q-dv').value=='x'?(+$('#q-dv2').value||0):+$('#q-dv').value;const later=f=>setTimeout(f,0);
const sub=o=>o.it.reduce((a,r)=>a+r.t,0),entV=o=>o.gr?0:txx(o.tx).valor,extra=o=>(o.ln||[]).reduce((a,l)=>a+(l.ex?txx(l.ex).valor:0),0);
const dsc=o=>(o.pays||[]).reduce((a,p)=>a+(p.ds||0),0),tot=o=>sub(o)+(+o.aj||0)+entV(o)+extra(o)-dsc(o),paid=o=>(o.pays||[]).reduce((a,p)=>a+p.v,0);
const cost=o=>o.it.reduce((a,r)=>a+(r.cu||0),0)+(o.tx?txx(o.tx).custo||0:0)+(o.ln||[]).reduce((a,l)=>a+(l.ex?txx(l.ex).custo||0:0),0),lucro=o=>tot(o)-cost(o);
const prevD=o=>o.conf?dt(addDU(o.conf,o.prev||0)):(o.prev||0)+' dias úteis';
const unl=o=>tot(o)>0&&paid(o)>=tot(o)/2-.005,done=o=>o.ln.length>0&&o.ln.every(l=>l.tl.length>=7);
const labs=l=>[...ET.slice(0,5),l.modo=='entrega'?'Em rota de entrega':'Pronto para retirada','Entregue/Retirado'];
function conf(o){if(!o.conf){o.conf=hoje();o.po=o.prev}}
function stat(o){if(o.est)return;if(o.venda){o.st=o.pays.length&&paid(o)>=tot(o)-.005?'pago':(o.pays.length?'aprovado':'aberto');return}if(['recusado','arquivado'].includes(o.st)||(o.st=='aberto'&&!o.pays.length))return;o.st=paid(o)>=tot(o)-.005&&o.pays.length?'pago':(done(o)?'executado':'aprovado')}
function sync(o){o.ln=o.ln||[];const ks=[];o.it.forEach(r=>(r.kc||[{iid:r.iid,nome:r.d,dd:r.dd}]).forEach(c=>{const k=r.rid+':'+(c.iid||0);ks.push(k);let l=o.ln.find(x=>x.k==k);if(!l){l={k,d:'',iid:c.iid,dd:0,prio:0,tl:[],oc:[],log:[],modo:'',ex:null,arte:null};o.ln.push(l)}l.iid=c.iid;l.d=r.kc?c.nome+' (kit '+r.d.replace(/^Kit /,'')+')':r.d;l.dd=r.kc?c.dd:r.dd}));o.ln=o.ln.filter(l=>ks.includes(l.k)||l.tl.length)}
db=load();

const idb=()=>new Promise((s,j)=>{const r=indexedDB.open('gg_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>s(r.result);r.onerror=j});
async function fput(k,v){const d=await idb();return new Promise(s=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=s})}
async function fget(k){const d=await idb();return new Promise(s=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>s(r.result)})}
async function fall(){const d=await idb(),o={};return new Promise(s=>{const r=d.transaction('f').objectStore('f').openCursor();r.onsuccess=()=>{const c=r.result;if(c){o[c.key]=c.value;c.continue()}else s(o)}})}
async function fclr(){const d=await idb();return new Promise(s=>{const t=d.transaction('f','readwrite');t.objectStore('f').clear();t.oncomplete=s})}

function render(){
 $('#tabs').innerHTML=[['ven','Venda'],['orc','Orçamentos'],['ped','Pedidos'],['cli','Clientes'],['it','Itens'],['kit','Kits'],['est','Estatísticas'],['cfg','Configurações']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';po=null;render()">${l}</button>`).join('');
 $('#main').innerHTML={ven:vVen,orc:vOrc,ped:vPed,cli:vCli,it:vIt,kit:vKit,est:vEst,cfg:vCfg}[tab]()}

/* VENDA (PDV) */
let vf='hoje';
function vVen(){const h=hoje(),dd=o=>o.pays.length?o.pays[o.pays.length-1].d:o.data,l=db.orc.filter(o=>o.venda&&(vf=='todas'||dd(o)==h||o.data==h)).sort((a,b)=>b.n-a.n),ok=l.filter(o=>o.st=='pago'&&!o.est),mf={};
 ok.forEach(o=>o.pays.forEach(p=>mf[p.f]=(mf[p.f]||0)+p.v));
 return `<div class="row"><button class="pri" onclick="openQ(null,true)">+ Nova venda</button><div class="acts"><button class="chip ${vf=='hoje'?'on':''}" onclick="vf='hoje';render()">Hoje</button><button class="chip ${vf=='todas'?'on':''}" onclick="vf='todas';render()">Todas</button></div></div>
 <div class="g2"><div class="form"><b>Resumo ${vf=='hoje'?'do dia':'geral'}</b><br>${ok.length} venda(s) · ${fmt(ok.reduce((a,o)=>a+tot(o),0))}<br>Lucro: ${fmt(ok.reduce((a,o)=>a+lucro(o),0))}</div><div class="form"><b>Por forma de pagamento</b>${bars(mf)}</div></div>
 <div class="list">${l.map(o=>{const c=cli(o.cid);return `<div class="item s-${o.est?'arquivado':o.st}"><div class="row"><b>Venda nº ${o.n} · ${esc(c?c.nome:'Consumidor')}</b><b>${fmt(tot(o))}</b></div><div class="mut">${dt(o.data)} · <span class="tag">${o.est?'Estornada':ST[o.st]}</span> · ${o.it.map(r=>esc(r.d)).join(', ')} · ${o.pays.map(p=>esc(p.f)).join(', ')}</div>
 <div class="acts" style="margin-top:6px"><button onclick="openQ(${o.id})">${o.pays.length?'Abrir':'Abrir / Receber'}</button>${o.pays.length?`<button onclick="recibo(get(${o.id}),${o.pays.length-1})">Recibo</button>`:''}${o.pays.length&&!o.est?`<button class="del" onclick="estornar(${o.id})">Estornar</button>`:''}${!o.pays.length?`<button class="del" onclick="delQ(${o.id})">Excluir</button>`:''}</div></div>`}).join('')||'<div class="item mut">Nenhuma venda neste período. Use "+ Nova venda".</div>'}</div>`}
function estornar(id){if(confirm('Estornar esta venda? O registro fica guardado, mas ela sai das estatísticas.')){const o=get(id);o.est=1;o.st='arquivado';save();render()}}

/* ORÇAMENTOS */
function vOrc(){
 const l=db.orc.filter(o=>!o.venda&&(flt=='todos'?o.st!='arquivado':o.st==flt)).sort((a,b)=>b.n-a.n);
 return `<div class="row"><div class="acts">${['todos',...Object.keys(ST)].map(s=>`<button class="chip ${flt==s?'on':''}" onclick="flt='${s}';render()">${s=='todos'?'Ativos':ST[s]}</button>`).join('')}</div><button class="pri" onclick="openQ()">+ Novo orçamento</button></div>
 <div class="list">${l.map(o=>{const c=cli(o.cid);return `<div class="item s-${o.st}"><div class="row"><b>Nº ${o.n} · ${esc(c?c.nome:'(sem cliente)')}</b><b>${fmt(tot(o))}</b></div><div class="mut">${dt(o.data)} · <span class="tag">${ST[o.st]}</span> · pago ${fmt(paid(o))} · saldo ${fmt(tot(o)-paid(o))}</div>
 <div class="acts" style="margin-top:6px"><button onclick="openQ(${o.id})">Editar / Pagamentos</button><button onclick="wpp(${o.id})">WhatsApp (texto)</button><button onclick="pdf(${o.id})">WhatsApp + PDF</button>
 ${o.st=='aberto'?`<button onclick="setM(${o.id},'recusado')">Recusar</button>`:''}${['recusado','arquivado'].includes(o.st)?`<button onclick="setM(${o.id},'aberto')">Reabrir</button>`:`<button onclick="setM(${o.id},'arquivado')">Arquivar</button>`}<button class="del" onclick="delQ(${o.id})">Excluir</button></div></div>`}).join('')||'<div class="item mut">Nenhum orçamento nesta lista.</div>'}</div>`}
function setM(id,s){const o=get(id);o.st=s;stat(o);save();render()}
function delQ(id){if(confirm('Excluir este orçamento?')){db.orc=db.orc.filter(o=>o.id!=id);save();render()}}

/* DIÁLOGO DO ORÇAMENTO */
const newRow=()=>({rid:'r'+(db.id++),d:'',u:'un',q:1,p:0,t:0,cu:0,cpu:0,dd:0});
function addRow(){its.push(newRow());rowsI()}
const cliOpts=sel=>'<option value="">— escolher cliente —</option>'+db.cli.map(c=>`<option value="${c.id}" ${sel==c.id?'selected':''}>${esc(c.nome)}</option>`).join('');
function fcq(){['n','t','e'].forEach(x=>$('#nc-'+x).value='');$('#nc-dup').innerHTML='';$('#q-nc').hidden=true}
function useC(id){$('#q-c').innerHTML=cliOpts(id);fcq()}
function dupCq(){const n=$('#nc-n').value.trim().toLowerCase(),t=$('#nc-t').value.replace(/\D/g,''),m=db.cli.filter(c=>(n.length>=2&&c.nome.toLowerCase().includes(n))||(t.length>=6&&(c.tel||'').replace(/\D/g,'').includes(t))).slice(0,4);$('#nc-dup').innerHTML=m.length?'Já cadastrado? '+m.map(c=>`<button type="button" onclick="useC(${c.id})">${esc(c.nome)} ${esc(c.tel)}</button>`).join(' '):''}
function addCq(){const n=$('#nc-n').value.trim();if(!n)return $('#nc-n').focus();const tel=$('#nc-t').value.trim(),d=db.cli.find(c=>c.nome.toLowerCase()==n.toLowerCase()||(tel&&(c.tel||'').replace(/\D/g,'')==tel.replace(/\D/g,'')));if(d&&confirm('Já existe o cliente "'+d.nome+'". Usar o cadastro existente?'))return useC(d.id);const c={id:db.id++,nome:n,tel,end:$('#nc-e').value.trim()};db.cli.push(c);save();useC(c.id)}
let vm=false;function dvSel(){$('#q-dv2').hidden=$('#q-dv').value!='x'}
function openQ(id,v){const o=id?get(id):null;vm=o?!!o.venda:!!v;edit=o?o.id:null;document.querySelectorAll('.nv').forEach(e=>e.hidden=vm);
 $('#dqt').textContent=o?(vm?'Venda':'Orçamento')+' nº '+o.n:(vm?'Nova venda':'Novo orçamento');
 $('#q-c').innerHTML=cliOpts(o?o.cid:null);$('#q-nc').hidden=true;{const d=dv(o||{});$('#q-dv').value=[5,10].includes(d)?d:'x';$('#q-dv2').value=[5,10].includes(d)?'':d;$('#q-dv2').hidden=[5,10].includes(d)}
 $('#q-x').innerHTML='<option value="">Sem entrega</option>'+db.tx.map(x=>`<option value="${x.id}" ${o&&o.tx==x.id?'selected':''}>${esc(x.nome)} - ${fmt(x.valor)}</option>`).join('');
 $('#q-d').value=o?o.data:hoje();$('#q-a').value=o?o.aj||'':'';$('#q-v').value=o?o.val:6;$('#q-g').checked=!!(o&&o.gr);
 its=o?o.it.map(x=>JSON.parse(JSON.stringify(x))):[newRow()];$('#q-o').value=o?o.obs:'';
 $('#dsrv').innerHTML=db.it.map(s=>`<option value="${esc(s.nome)}">`).join('')+db.kits.map(k=>`<option value="Kit: ${esc(k.nome)}">`).join('');
 rowsI();$('#q-pv').value=o?o.prev:Math.max(0,...its.map(r=>r.dd||0));pgs();$('#dq').showModal()}
function rowsI(){$('#q-i').innerHTML=its.map((r,i)=>{const it=db.it.find(x=>x.id==r.iid);return `<div class="rw"><div class="it">
 <label class="c1">Item / descrição<input id="rn${i}" list="dsrv" placeholder="Digite ou escolha um item" value="${esc(r.d)}" onchange="pick(${i},this.value)"></label>
 <label>Unidade de medida<input value="${esc(r.u)}" oninput="its[${i}].u=this.value"></label>
 <label>Quantidade<input type="number" step="any" id="rq${i}" value="${r.q}" oninput="rc(${i},'q',this.value)"></label>
 <label>Valor unitário (R$)<input type="number" step="any" id="rp${i}" value="${+(+r.p).toFixed(4)}" oninput="rc(${i},'p',this.value)"></label>

function calc(i){const r=its[i],it=db.it.find(x=>x.id==r.iid),k=db.kits.find(x=>x.id==r.kid);
 if(k){r.d='Kit '+k.nome;r.u='kit';const pr=k.promoOn&&k.promo;r.pn=pr?k.preco:0;r.p=pr?k.promo:k.preco;r.kc=k.itens.map(c=>{const x=db.it.find(y=>y.id==c.iid)||{};return{iid:c.iid,nome:(c.q>1?c.q+'x ':'')+(x.nome||'?'),dd:x.dias||0}});r.cpu=k.itens.reduce((a,c)=>a+((db.it.find(y=>y.id==c.iid)||{}).cp||0)*c.q,0);r.dd=Math.max(0,...r.kc.map(c=>c.dd))}
 else if(it&&it.tipo=='m2'){const w=+r.w||0,h=+r.h||0,a=Math.max(w*h,+it.mm||0),pr=it.promoOn&&it.pr;r.u='un';r.ar=a;r.pn=pr?it.mp:0;r.p=a*(pr?it.pr:it.mp);r.cpu=a*(+it.cm||0);r.dd=it.dias||0;r.d=`${it.nome} ${fm(w)} x ${fm(h)} m (${fm(a)} m²${a>w*h?', mínimo':''})`}
 else if(it&&it.tipo=='lote'){const l=it.lotes[r.lq||0];if(!l)return;const pr=it.promoOn&&l.pr;r.q=1;r.u='unidades';r.d=`${fm(l.q)} unid. ${it.nome}`;r.pn=pr?l.t:0;r.p=pr?l.pr:l.t;r.cpu=+l.c||0;r.dd=+l.d||0}
 else if(it){r.d=it.nome;r.u=it.un||'un';const pr=it.promoOn&&it.pr;r.pn=pr?it.preco:0;r.p=pr?it.pr:it.preco;r.cpu=it.cp||0;r.dd=it.dias||0}
 r.p=rnd(r.p*1e4)/1e4;r.t=rnd(r.q*r.p);r.cu=rnd(r.q*r.cpu)}

/* CLIENTES */
function vCli(){const c=ec?cli(ec):{};
 return `<div class="form"><b>${ec?'Editar cliente':'Novo cliente'}</b><label>Nome<input id="c-n" value="${esc(c.nome)}"></label><label>Telefone / WhatsApp com DDD<input id="c-t" value="${esc(c.tel)}"></label><label>Endereço<input id="c-e" value="${esc(c.end)}"></label><div class="acts"><button class="pri" onclick="saveC()">Salvar cliente</button>${ec?'<button onclick="ec=null;render()">Cancelar</button>':''}</div></div>
 <div class="list">${db.cli.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<div class="item"><div class="row"><div><b>${esc(c.nome)}</b><div class="mut">${esc(c.tel)} ${esc(c.end)}</div></div><span class="acts"><button onclick="hc=hc==${c.id}?null:${c.id};render()">Histórico</button>${c.end?`<button onclick="mapa(${c.id})">Ver no mapa</button>`:''}<button onclick="ec=${c.id};render()">Editar</button><button class="del" onclick="if(confirm('Excluir cliente?')){db.cli=db.cli.filter(x=>x.id!=${c.id});save();render()}">Excluir</button></span></div>
 ${hc==c.id?db.orc.filter(o=>o.cid==c.id).map(o=>`<div class="mut" style="margin-left:10px">Nº ${o.n} · ${dt(o.data)} · ${ST[o.st]} · ${fmt(tot(o))}${o.ln.length?' · '+(done(o)?'Entregue':glab(o)):''}</div>`).join('')||'<div class="mut">Sem orçamentos.</div>':''}</div>`).join('')||'<div class="item mut">Nenhum cliente cadastrado.</div>'}</div>`}
function saveC(){const d={nome:$('#c-n').value.trim(),tel:$('#c-t').value.trim(),end:$('#c-e').value.trim()};if(!d.nome)return $('#c-n').focus();if(ec)Object.assign(cli(ec),d);else db.cli.push({id:db.id++,...d});ec=null;save();render()}

/* ITENS */
function vIt(){const i=ei?db.it.find(x=>x.id==ei):{},tp=i.tipo||'un',v=x=>esc(i[x]??''),s=a=>tp==a?'':'style="display:none"';
 if(!di.on){dl=(i.lotes||[]).map(x=>({...x}));di.on=1}
 return `<div class="form"><b>${ei?'Editar item':'Novo item'}</b> <span class="mut">(itens digitados no orçamento são salvos aqui automaticamente)</span>
 <div class="g2"><label>Nome ou descrição do produto<input id="i-n" value="${v('nome')}"></label>
 <label>Como o produto é vendido<select id="i-tp" onchange="tpSel(this.value)"><option value="un">Por unidade / quantidade</option><option value="lote" ${tp=='lote'?'selected':''}>Lotes fixos (ex.: panfleto 1.000, 2.500...)</option><option value="m2" ${tp=='m2'?'selected':''}>Por metro quadrado (m²)</option></select></label>
 <label>Tipo de produção<select id="i-pd"><option value="local">Produção local</option><option value="terc" ${i.prod=='terc'?'selected':''}>Produção terceirizada</option></select></label>
 <label>Parceiro (se terceirizada)<select id="i-pa"><option value="">—</option>${db.par.map(p=>`<option value="${p.id}" ${i.par==p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
 <label>Prazo de produção (dias úteis)<input id="i-d" type="number" value="${v('dias')}"></label><label><br><input type="checkbox" id="i-po" ${i.promoOn?'checked':''}>Promoção ativa</label></div>
 <div id="s-un" ${s('un')}><div class="g2"><label>Unidade de medida (un, m, cento...)<input id="i-u" value="${v('un')}"></label><label>Quantidade (ex.: 250)<input id="i-q" type="number" step="any" value="${v('q')}" oninput="fi('q')"></label>
 <label>Valor total do produto (R$)<input id="i-t" type="number" step="any" value="${i.q&&i.preco?+(i.q*i.preco).toFixed(2):''}" oninput="fi('t')"></label><label>Valor unitário (R$)<input id="i-p" type="number" step="any" value="${v('preco')}" oninput="fi('p')"></label>
 <label>Custo total (R$)<input id="i-ct" type="number" step="any" value="${i.q&&i.cp?+(i.q*i.cp).toFixed(2):''}" oninput="fi('ct')"></label><label>Custo unitário (R$)<input id="i-cp" type="number" step="any" value="${v('cp')}" oninput="fi('cp')"></label>
 <label>Valor unitário promocional (R$)<input id="i-pr" type="number" step="any" value="${i.tipo!='m2'?v('pr'):''}"></label></div></div>
 <div id="s-m2" ${s('m2')}><div class="mut">A largura e a altura são pedidas na hora do orçamento.</div><div class="g2"><label>Valor do m² (R$)<input id="i-mp" type="number" step="any" value="${v('mp')}"></label><label>Custo do m² (R$)<input id="i-cm" type="number" step="any" value="${v('cm')}"></label><label>Metragem mínima cobrada (m², ex.: 0,5 ou 1)<input id="i-mm" type="number" step="any" value="${v('mm')}"></label><label>Valor promocional do m² (R$)<input id="i-pm" type="number" step="any" value="${i.tipo=='m2'?v('pr'):''}"></label></div></div>
 <div id="s-lote" ${s('lote')}><div class="mut">Cada lote tem valor, custo, prazo e promoção próprios.</div><div class="g2"><label>Quantidade do lote (ex.: 1000)<input id="l-q" type="number"></label><label>Valor do lote (R$)<input id="l-t" type="number" step="any"></label><label>Custo do lote (R$)<input id="l-c" type="number" step="any"></label><label>Prazo do lote (dias úteis)<input id="l-d" type="number"></label><label>Valor promocional do lote (R$)<input id="l-p" type="number" step="any"></label><label><br><button onclick="addL()">Adicionar lote</button></label></div><div id="l-list">${lotesH()}</div></div>
 <div class="acts"><button class="pri" onclick="saveI()">Salvar item</button>${ei?'<button onclick="ei=null;di={};render()">Cancelar</button>':''}</div></div>
 <div class="list">${db.it.map(i=>`<div class="item row"><div><b>${esc(i.nome)}</b> <span class="mut">${i.tipo=='m2'?fmt(i.mp)+'/m²'+(i.mm?' · mín. '+fm(i.mm)+' m²':''):i.tipo=='lote'?(i.lotes||[]).length+' lote(s)':esc(i.un||'un')+' · '+fmt(i.preco)+(i.cp?' · custo '+fmt(i.cp):'')}${i.promoOn?' · promoção':''} · ${i.prod=='terc'?'terceirizado':'local'}${i.tipo!='lote'?' · '+(i.dias||0)+' dias':''}</span></div><span class="acts"><button onclick="ei=${i.id};di={};render()">Editar</button><button class="del" onclick="if(confirm('Excluir item?')){db.it=db.it.filter(x=>x.id!=${i.id});save();render()}">Excluir</button></span></div>`).join('')||'<div class="item mut">Nenhum item cadastrado.</div>'}</div>`}
function tpSel(v){['un','m2','lote'].forEach(t=>$('#s-'+t).style.display=t==v?'':'none')}
function fi(k){const g=x=>+$('#i-'+x).value||0,s=(x,v)=>$('#i-'+x).value=+(+v).toFixed(4);
 if(k=='t'&&g('q'))s('p',g('t')/g('q'));if(k=='p')s('t',g('p')*g('q'));
 if(k=='q'){if(g('p'))s('t',g('p')*g('q'));else if(g('t'))s('p',g('t')/g('q'));if(g('cp'))s('ct',g('cp')*g('q'));else if(g('ct'))s('cp',g('ct')/g('q'))}
 if(k=='ct'&&g('q'))s('cp',g('ct')/g('q'));if(k=='cp')s('ct',g('cp')*g('q'))}
const lotesH=()=>dl.map((l,j)=>`<div class="row">${fm(l.q)} unid. · ${fmt(l.t)} · custo ${fmt(l.c)} · ${l.d||0} dias${l.pr?' · promo '+fmt(l.pr):''}<button class="del" onclick="dl.splice(${j},1);$('#l-list').innerHTML=lotesH()">✕</button></div>`).join('');
function addL(){const q=+$('#l-q').value,t=+$('#l-t').value;if(!q||!t)return;dl.push({q,t,c:+$('#l-c').value||0,d:+$('#l-d').value||0,pr:+$('#l-p').value||0});dl.sort((a,b)=>a.q-b.q);['q','t','c','d','p'].forEach(x=>$('#l-'+x).value='');$('#l-list').innerHTML=lotesH()}
function saveI(){const tp=$('#i-tp').value,d={nome:$('#i-n').value.trim(),tipo:tp,prod:$('#i-pd').value,par:+$('#i-pa').value||null,dias:+$('#i-d').value||0,promoOn:$('#i-po').checked};if(!d.nome)return $('#i-n').focus();
 if(tp=='un')Object.assign(d,{un:$('#i-u').value.trim()||'un',q:+$('#i-q').value||0,preco:+$('#i-p').value||0,cp:+$('#i-cp').value||0,pr:+$('#i-pr').value||0});
 if(tp=='m2')Object.assign(d,{mp:+$('#i-mp').value||0,cm:+$('#i-cm').value||0,mm:+$('#i-mm').value||0,pr:+$('#i-pm').value||0});
 if(tp=='lote'){if(!dl.length)return alert('Adicione pelo menos um lote.');d.lotes=dl}
 if(ei)Object.assign(db.it.find(x=>x.id==ei),d);else db.it.push({id:db.id++,...d});ei=null;di={};save();render()}

/* KITS */
function vKit(){const k=ek?db.kits.find(x=>x.id==ek):{};if(!di.k){dk=(k.itens||[]).map(x=>({...x}));di.k=1}
 const un=db.it.filter(i=>(i.tipo||'un')=='un'),cs=dk.reduce((a,c)=>a+((db.it.find(y=>y.id==c.iid)||{}).cp||0)*c.q,0),vs=dk.reduce((a,c)=>a+((db.it.find(y=>y.id==c.iid)||{}).preco||0)*c.q,0);
 return `<div class="form"><b>${ek?'Editar kit':'Novo kit'}</b><div class="g2"><label>Nome do kit<input id="k-n" value="${esc(k.nome)}"></label><label><input type="checkbox" id="k-po" ${k.promoOn?'checked':''}> Promoção ativa</label>
 <label>Item do kit<select id="k-i"><option value="">Escolher item</option>${un.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}</select></label><div class="acts"><label>Quantidade<input id="k-q" type="number" value="1" style="width:80px"></label><button onclick="addK()">Adicionar ao kit</button></div></div>
 ${dk.map((c,j)=>`<div class="row">${c.q}x ${esc((db.it.find(y=>y.id==c.iid)||{}).nome)}<button class="del" onclick="dk.splice(${j},1);render()">✕</button></div>`).join('')}
 <div class="mut">Soma dos itens: ${fmt(vs)} · custo: ${fmt(cs)} (kits só aceitam itens por unidade)</div>
 <div class="g2"><label>Valor do kit (R$)<input id="k-p" type="number" step="any" value="${esc(k.preco??'')}"></label><label>Valor promocional do kit (R$)<input id="k-pr" type="number" step="any" value="${esc(k.promo??'')}"></label></div>
 <div class="acts"><button class="pri" onclick="saveK()">Salvar kit</button>${ek?'<button onclick="ek=null;di={};render()">Cancelar</button>':''}</div></div>
 <div class="list">${db.kits.map(k=>`<div class="item row"><div><b>${esc(k.nome)}</b> <span class="mut">${k.itens.length} item(ns) · ${fmt(k.preco)}${k.promoOn?' · promo '+fmt(k.promo):''}</span></div><span class="acts"><button onclick="ek=${k.id};di={};render()">Editar</button><button class="del" onclick="if(confirm('Excluir kit?')){db.kits=db.kits.filter(x=>x.id!=${k.id});save();render()}">Excluir</button></span></div>`).join('')||'<div class="item mut">Nenhum kit cadastrado.</div>'}</div>`}
function addK(){const i=+$('#k-i').value,q=+$('#k-q').value||1;if(!i)return;const n=$('#k-n').value,p=$('#k-p').value,pr=$('#k-pr').value,po=$('#k-po').checked;dk.push({iid:i,q});render();$('#k-n').value=n;$('#k-p').value=p;$('#k-pr').value=pr;$('#k-po').checked=po}
function saveK(){const d={nome:$('#k-n').value.trim(),itens:dk,preco:+$('#k-p').value||0,promo:+$('#k-pr').value||0,promoOn:$('#k-po').checked};if(!d.nome||!dk.length)return alert('Informe o nome e adicione itens ao kit.');if(ek)Object.assign(db.kits.find(x=>x.id==ek),d);else db.kits.push({id:db.id++,...d});ek=null;di={};save();render()}

/* ESTATÍSTICAS */
const wk=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return 'Sem. '+dt(x.toLocaleDateString('sv'))};
function bars(m,sort){const e=Object.entries(m).sort(sort?(a,b)=>b[0].localeCompare(a[0]):(a,b)=>b[1]-a[1]).slice(0,12),mx=Math.max(1,...e.map(x=>Math.abs(x[1])));return e.map(([k,x])=>`<div class="br"><span>${esc(est=='mes'&&sort?k.split('-').reverse().join('/'):k)}</span><i style="width:${Math.abs(x)/mx*100}%"></i><b>${fmt(x)}</b></div>`).join('')||'<div class="mut">Sem dados.</div>'}
function vEst(){const v=db.orc.filter(o=>o.st=='pago'||(o.st=='executado'&&paid(o)>=tot(o)-.005)),ds=o=>o.pays.length?o.pays[o.pays.length-1].d:o.data,m={},ml={},mc={},mi={},mil={},mf={};
 v.forEach(o=>{const k=est=='mes'?ds(o).slice(0,7):est=='dia'?ds(o):wk(ds(o)),L=lucro(o);m[k]=(m[k]||0)+tot(o);ml[k]=(ml[k]||0)+L;const n=(cli(o.cid)||{nome:'(sem cliente)'}).nome;mc[n]=(mc[n]||0)+tot(o);o.it.forEach(r=>{mi[r.d]=(mi[r.d]||0)+r.t;mil[r.d]=(mil[r.d]||0)+r.t-r.cu})});
 db.orc.filter(o=>!o.est).forEach(o=>o.pays.forEach(p=>mf[p.f]=(mf[p.f]||0)+p.v));
 const bd=(a,b)=>{let n=0,x=new Date(a+'T12:00');const y=new Date(b+'T12:00');while(x<y){x.setDate(x.getDate()+1);if(x.getDay()%6)n++}return n},pz={};
 db.orc.forEach(o=>{if(!o.conf)return;o.ln.forEach(l=>{const t=l.tl[6];if(l.tl.length>=7&&t&&t.ts)(pz[l.d]=pz[l.d]||[]).push([l.dd||0,bd(o.conf,t.ts)])})});
 const avg=(a,i)=>a.reduce((x,y)=>x+y[i],0)/a.length;
 const T=v.reduce((a,o)=>a+tot(o),0),LT=v.reduce((a,o)=>a+lucro(o),0),ar=db.orc.filter(o=>['aprovado','executado'].includes(o.st)).reduce((a,o)=>a+tot(o)-paid(o),0),Q=db.orc.filter(o=>!o.venda),ap=Q.filter(o=>['aprovado','executado','pago'].includes(o.st)).length;
 return `<div class="form"><div class="row"><b>Vendas finalizadas (pedidos pagos)</b><select style="width:auto" onchange="est=this.value;render()">${[['dia','Por dia'],['sem','Por semana'],['mes','Por mês']].map(([k,l])=>`<option value="${k}" ${est==k?'selected':''}>${l}</option>`).join('')}</select></div>${bars(m,1)}<b>Lucro no período</b>${bars(ml,1)}</div>
 <div class="g2"><div class="form"><b>Total vendido</b><br>${fmt(T)}<br><br><b>Lucro</b><br>${fmt(LT)} (${T?Math.round(LT/T*100):0}% de margem)<br><br><b>Ticket médio</b><br>${fmt(v.length?T/v.length:0)}</div><div class="form"><b>A receber</b><br>${fmt(ar)}<br><br><b>Taxa de aprovação</b><br>${ap} de ${Q.length} orçamentos (${Q.length?Math.round(ap/Q.length*100):0}%)</div></div>
 <div class="g2"><div class="form"><b>Vendas por cliente</b>${bars(mc)}</div><div class="form"><b>Vendas por item</b>${bars(mi)}</div></div><div class="g2"><div class="form"><b>Lucro por item</b>${bars(mil)}</div><div class="form"><b>Recebido por forma de pagamento</b>${bars(mf)}</div></div><div class="form"><b>Prazo previsto x real (dias úteis)</b>${Object.entries(pz).map(([k,a])=>`<div class="row"><span>${esc(k)}</span><span>previsto ${fm(avg(a,0))} · real ${fm(avg(a,1))} (${a.length} entrega(s))</span></div>`).join('')||'<div class="mut">Aparece depois das primeiras entregas registradas.</div>'}</div>`}

/* CONFIGURAÇÕES */
function vCfg(){const e=db.emp,F=[['nome','Nome da loja'],['end','Endereço'],['tel','Telefone / WhatsApp'],['ig','Instagram'],['cnpj','CNPJ (opcional)'],['pix','Chave Pix'],['titular','Titular do Pix']];
 return `<div class="form"><b>Dados da loja (aparecem no PDF)</b><div class="g2">${F.map(([k,l])=>`<label>${l}<input value="${esc(e[k])}" onchange="db.emp.${k}=this.value;save()"></label>`).join('')}</div>
 <label>Logo<input type="file" accept="image/*" onchange="logo(this.files[0])"></label>${e.logo?`<img src="${e.logo}" style="max-height:60px"> <button onclick="delete db.emp.logo;save();render()">Remover logo</button>`:''}</div>
 <div class="form"><b>Parceiros de produção</b><div class="g2"><label>Nome<input id="pn"></label><label>E-mail<input id="pe"></label><label>Telefone<input id="pt"></label><label>Endereço<input id="pa"></label></div><button class="pri" onclick="addP()">Adicionar parceiro</button>
 ${db.par.map(p=>`<div class="row">${esc(p.nome)} <span class="mut">${esc(p.email)} ${esc(p.tel)}</span><button class="del" onclick="db.par=db.par.filter(x=>x.id!=${p.id});save();render()">Excluir</button></div>`).join('')}</div>
 <div class="form"><b>Taxas de entrega</b><div class="g2"><label>Nome da taxa (ex.: Área 1)<input id="xn"></label><label>Valor cobrado do cliente (R$)<input id="xv" type="number" step="any"></label><label>Custo da entrega, o que você paga (R$)<input id="xc" type="number" step="any"></label></div><button class="pri" onclick="addX()">Adicionar taxa</button>
 ${db.tx.map(x=>`<div class="row">${esc(x.nome)} · ${fmt(x.valor)} <span class="mut">custo ${fmt(x.custo)}</span><button class="del" onclick="db.tx=db.tx.filter(y=>y.id!=${x.id});save();render()">Excluir</button></div>`).join('')}</div>
 <div class="form"><b>Mensagens de status (use {nome}, {n}, {prev})</b>${ET.map((t,i)=>`<label>${t}<textarea rows="2" onchange="db.msg[${i}]=this.value;save()">${esc(db.msg[i])}</textarea></label>`).join('')}</div>
 <div class="form"><b>Backup</b><p class="mut">Os dados ficam neste navegador (os PDFs das artes também). Baixe um backup com frequência.</p><div class="acts"><button class="pri" onclick="exp()">Baixar backup</button><button onclick="$('#imp').click()">Restaurar backup</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><button class="del" onclick="zerar()">Zerar tudo</button></div></div>`}
function addP(){if(!$('#pn').value.trim())return;db.par.push({id:db.id++,nome:$('#pn').value,email:$('#pe').value,tel:$('#pt').value,end:$('#pa').value});save();render()}
function addX(){if(!$('#xn').value.trim())return;db.tx.push({id:db.id++,nome:$('#xn').value,valor:+$('#xv').value||0,custo:+$('#xc').value||0});save();render()}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.emp.logo=c.toDataURL('image/png');save();render()};i.src=r.result};r.readAsDataURL(f)}
async function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...db,_files:await fall()})],{type:'application/json'}));a.download='gestao-grafica-backup-'+hoje()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.orc||!d.cli)throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;const fl=d._files||{};delete d._files;db=norm(d);save();await fclr();for(const k in fl)await fput(k,fl[k]);render()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
async function zerar(){if(!confirm('Isso apaga TODOS os dados (clientes, itens, pedidos, artes e configurações). Um backup será baixado antes. Continuar?'))return;if(prompt('Para confirmar, digite ZERAR:')!=='ZERAR')return;await exp();localStorage.removeItem(K);await fclr();db=fresh();tab='orc';po=null;render()}
render();
</script></body></html>
