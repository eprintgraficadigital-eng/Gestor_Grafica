<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#172b4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Gestão da Gráfica — Versão 3</title>
<link rel="stylesheet" href="./styles.css"><style id="pg"></style><meta name="color-scheme" content="light"></head><body>
<header><button id="mn" type="button" onclick="toggleNav()" aria-label="Menu" title="Menu">☰</button><b>Gestão da Gráfica</b><span class="header-sub">Painel administrativo</span></header><div id="shell"><nav id="tabs"></nav><div id="cont"><main id="main"></main>

<section id="dq" hidden><div class="pagehd"><h3 id="dqt"></h3><button type="button" onclick="qClose()" title="Fechar" aria-label="Fechar">✕</button></div>
<div class="g2"><div><label>Cliente<select id="q-c"></select></label><button type="button" onclick="ncOpen('q')">+ Novo cliente</button></div><label>Data do orçamento<input type="date" id="q-d"></label></div>
<div id="q-i" style="margin-top:8px"></div>
<button onclick="addRow()">+ Produto</button>
<div class="g2" style="margin-top:8px"><label class="nv">Entrega<select id="q-x" onchange="qt()"></select></label><label class="nv"><br><input type="checkbox" id="q-g" onchange="qt()"> Entrega grátis (promoção)</label>
<label>Desconto no pagamento à vista<select id="q-dv" onchange="dvSel()"><option value="5">5% (padrão)</option><option value="10">10%</option><option value="x">Outro valor (%)</option></select><input type="number" step="any" id="q-dv2" placeholder="% de desconto" hidden></label><label>Ajuste em R$ (use − para desconto em valor)<input type="number" step="any" id="q-a" oninput="qt()"></label>
<label class="nv">Validade do orçamento (dias)<input type="number" id="q-v"></label><label class="nv">Previsão de produção (dias úteis)<input type="number" id="q-pv"></label></div>
<label>Observações<textarea id="q-o" rows="2"></textarea></label>
<div id="q-pg"></div>
<div class="row"><span><b>Total: <span id="q-t"></span></b><br><span class="mut" id="q-l"></span></span><span class="acts"><button onclick="qClose()">Fechar</button><button class="pri" onclick="saveQ()">Salvar</button></span></div></section></div></div>
<dialog id="dp"></dialog>
<dialog id="dd"></dialog>
<dialog id="dnc">
<div class="row"><b>Novo cliente</b><button type="button" onclick="fcq()" aria-label="Fechar">✕</button></div>
<div class="g2">
<label>CPF/CNPJ<input id="nc-doc" autocomplete="off"></label>
<label>Nome da Empresa (para CNPJ)<input id="nc-company" autocomplete="organization"></label>
<label>Nome<input id="nc-n" oninput="dupCq()" autocomplete="given-name"></label>
<label>Sobrenome<input id="nc-last" autocomplete="family-name"></label>
<label>Telefone<input id="nc-t" oninput="dupCq()" placeholder="(85) 99999-9999" autocomplete="tel"></label>
<label>WhatsApp<input id="nc-wa" placeholder="(85) 99999-9999"></label>
<label>E-mail<input id="nc-email" type="email" autocomplete="email"></label>
<label>Endereço<input id="nc-e" autocomplete="street-address"></label>
</div>
<label>Observação<textarea id="nc-obs" rows="2"></textarea></label>
<div id="nc-dup" class="acts mut"></div>
<div class="acts" style="justify-content:flex-end;margin-top:8px"><button type="button" onclick="fcq()">Voltar</button><button type="button" class="pri" onclick="addCq()">Salvar e selecionar</button></div>
</dialog>
<dialog id="dnp"><h3 style="margin:0 0 8px">Novo produto</h3>
<label>Código (número, letras ou código de barras)<input id="np-c" autocomplete="off"></label>
<label><input type="checkbox" id="np-a" onchange="npA()"> Gerar código automático (próximo número disponível)</label>
<label>Nome<input id="np-n" autocomplete="off"></label>
<label>Valor (R$)<input id="np-v" type="number" step="any" min="0"></label>
<div class="acts" style="justify-content:flex-end;margin-top:8px"><button onclick="$('#dnp').close()">Cancelar</button><button class="pri" onclick="npS()">Salvar e adicionar à venda</button></div></dialog>
<datalist id="dsrv"></datalist>
<div id="bar" hidden><span>Salve o PDF e depois anexe na conversa.</span><button class="pri" id="bar-b">Abrir WhatsApp do cliente</button><button onclick="$('#bar').hidden=true">Fechar</button></div>
<div id="print"></div>

<script src="./app.js"></script>
<script>
// Registro PWA: não altera os dados nem a lógica do Gestão da Gráfica.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch(err => console.error('Falha ao registrar o modo offline:', err));
  });
}
</script>
</body></html>
